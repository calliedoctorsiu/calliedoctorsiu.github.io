        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="js/jquery.slicknav.js"></script>
    </head>
    <body>
        <div class="hero_area">
        <header class="header_section">
        <nav class="navbar">
            <div class="navbar-collapse" id="navbar">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item">
                    <a class="nav-link" href="shop.html">Shop</a></li>
                <li class="nav-item">

                <li class="nav-item">

                    <a class="nav-link" href="services.html">Contact</a></li>
                <li class="nav-item logo-item">
                    <a class="logo-item" href="index.html">
                <img src="/images/logo.jpg" alt="PTTM Logo" class="logo" /></a></li>

            <button class="burger-icon" type="button" onclick="toggleDropdown()">
                <img src="/images/burger.png" alt="Menu Button">
            </button>
            <div id="dropdown-content" class="dropdown-content">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>

                </ul>
            </div>
        </header>
    </div>

    <script>
        function toggleDropdown() {
            const dropdownContent = document.getElementById('dropdown-content');
            dropdownContent.classList.toggle('show');
        }

        window.addEventListener('click', function (e) {
            const dropdownContent = document.getElementById('dropdown-content');
            const burgerIcon = document.querySelector('.burger-icon');

            if (!burgerIcon.contains(e.target) && !dropdownContent.contains(e.target)) {
                dropdownContent.classList.remove('show');
            }
        });
    </script>
</body>
    
    
</html>
