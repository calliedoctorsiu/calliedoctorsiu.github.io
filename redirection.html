<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Bait &amp; Tackle</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style/slicknav.css">
        <link rel="stylesheet" href="style/shop.css">
        <link rel="stylesheet" href="style/footer.css">
    </head>
    <body>
        <header id="nav" src="./style/slicknav.css">
        <div class="header-image-container" id="headerImageContainer">
            <img src="./images/fishlogo.png" alt="logo" id="headerImage">
        </div>
            <nav class="desktop-nav" role="navigation" aria-label="Primary Navigation">
                <a href="./index.html">Home</a>
                <gear-btn class="gear-btn" aria-expanded="false" aria-controls="gear-dropdown">Gear</gear-btn>
                <div id="gear-dropdown" class="gear-content">
                    <a href="./gear.html"><p>Outdoors</p></a>
                    <a href="./"><p>Apparel</p></a>
                    <a href="./tanks"><p>Tanks</p></a>
                </div>
                <a href="./fish.html">Fish</a>
                <a href="./care.html">Services and Care</a>
                <a href="./about.html">About Us</a>
            </nav>
            <button type="button" class="menu-btn" aria-expanded="false" aria-controls="mobile-menu">
            <img src="./images/fishlogo.png" alt="logo" id="header-image-button">
            </button>
            <nav id="mobile-menu" class="menu-content" role="navigation" aria-label="Mobile Navigation">
                <a href="./index.html">Home</a>
                <a href="./gear.html">Apparel</a>
                <a href="./gear.html">Outdoors</a>
                <a href="./fish.html">Fish</a>
                <a href="./tanks.html">Tanks</a>
                <a href="./care.html">Services</a>
                <a href="./about.html">About</a>
                <a href="./form.html">Apply!</a>
            </nav>
        </header>
    
    <main>
       <img src="./images/fishloading.gif" alt="Load Fish" height="500">
    </main>

    <footer class="footer">
        <div class="footer-content">
        <h2 class="footer-title">FIND US!</h2>
        <ul class="footer-icon">
            <li><img src="./images/insta.png" height="40"></li>
            <li><img src="./images/twitter.png" height="40"></li>
            <li><img src="./images/youtub.png" height="40"></li>
            <li><img src="./images/locat.png" height="40"></li>
            <li><img src="./images/maul.png" height="40"></li>
        </ul>
        </div>
        <h5 class="copyright">© 2004 Bait &amp; Tackle  |  All Rights Reserved  |  Privacy Policy</h5>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const menuBtn = document.querySelector('.menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            const gearBtn = document.querySelector('.gear-btn');
            const gearDropdown = document.getElementById('gear-dropdown');

            menuBtn.addEventListener('click', function () {
                const expanded = menuBtn.getAttribute('aria-expanded') === 'true';
                menuBtn.setAttribute('aria-expanded', String(!expanded));
                mobileMenu.classList.toggle('show');
            });

            gearBtn.addEventListener('click', function () {
                const expanded = gearBtn.getAttribute('aria-expanded') === 'true';
                gearBtn.setAttribute('aria-expanded', String(!expanded));
                gearDropdown.classList.toggle('show');
            });

            gearBtn.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    gearBtn.click();
                }
            });

            document.addEventListener('click', function (event) {
                if (!gearBtn.contains(event.target) && !gearDropdown.contains(event.target)) {
                    gearDropdown.classList.remove('show');
                    gearBtn.setAttribute('aria-expanded', 'false');
                }
            });
        });
    </script>

    </body>
</html>
